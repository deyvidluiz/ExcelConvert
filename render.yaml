services:
  - type: web
    name: excelconvert
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn excelconvert.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: excelconvert-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: EXCEL_TEMPLATE_PASSWORD
        sync: false
      - key: CEMIG_TEMPLATE_VERSION
        value: "1.0.0"
      - key: CEMIG_EXCEL_TEMPLATE_PATH
        sync: false
      - key: CEMIG_EXCEL_TEMPLATE_NAME
        value: "TCA VÃO 217F - ITMU"
      - key: CEMIG_EXCEL_TEMPLATE_VERSION
        sync: false
      - key: MAX_UPLOAD_SIZE_MB
        value: "15"
      - key: MAX_UPLOAD_FILES
        value: "5"
      - key: MAX_DOCUMENT_PAGES
        value: "30"
      - key: MAX_MONTHLY_API_CALLS
        value: "100"
      - key: DOCUMENT_RETENTION_DAYS
        value: "90"
    disk:
      name: excelconvert-media
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: excelconvert-db
    plan: basic-256mb
    databaseName: excelconvert
    user: excelconvert
